# GitHub only honours "Closes #N" on merges into the default branch (main), and tickets merge into beta.
name: Close linked issues

on:
  pull_request:
    types: [closed]
    branches: [beta]

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues referenced in the PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issues=$(printf '%s' "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)

          for issue in $issues; do
            state=$(gh issue view "$issue" --repo "$REPO" --json state --jq .state || echo MISSING)
            if [ "$state" = "OPEN" ]; then
              gh issue close "$issue" --repo "$REPO" --reason completed \
                --comment "Merged into beta in #$PR_NUMBER."
            fi
          done
