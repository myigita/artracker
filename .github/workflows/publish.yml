# Runs the test suite on every pull request, and on pushes to the two long-lived
# branches also builds a Docker image and publishes it to GHCR — so the deployed
# container is updated by pulling instead of rebuilding by hand on the host.
#
# Which tag you get depends on the branch (see the branch note in CLAUDE.md):
#
#   main -> :latest   stable, and what the VPS pulls
#   beta -> :beta     integration, for testing a change before promoting it
#
# Both also get a short-sha tag. The package must be made PUBLIC once by hand
# (Packages -> artracker -> Package settings -> Change visibility) or Cosmos
# needs registry credentials to pull it.

name: Publish image

on:
  push:
    branches: [main, beta]
  # Tests run on PRs too, but nothing is published from one. Without this a PR
  # carries no signal at all and "merge once it's green" has nothing to be
  # green — the whole point of merging into beta before main.
  pull_request:
    branches: [main, beta]
  workflow_dispatch: # lets you trigger a rebuild by hand from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate the publish on the test suite — a broken image shouldn't be
  # deployable just because it compiled.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck and lint
        working-directory: frontend
        run: |
          npx tsc -b
          npm run lint

  publish:
    needs: test
    # Pull requests get the tests above and stop there. Publishing from a PR
    # would let an unmerged branch overwrite a tag the VPS pulls.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required for pushing to GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided automatically by Actions — no secret to configure.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # One tag per branch role, so promoting beta to main is what moves
          # :latest — never a beta build. The sha tag is on both, and is the
          # only way back to a specific build once a moving tag advances.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs so repeat builds don't reinstall
          # every dependency from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
