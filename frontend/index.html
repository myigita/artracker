<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artracker</title>
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (['light', 'dark', 'bauhaus', 'oled', 'oled-dim', 'oled-custom'].includes(theme)) document.documentElement.dataset.theme = theme;
        const accent = localStorage.getItem('accent');
        if (/^#[0-9a-f]{6}$/i.test(accent)) document.documentElement.style.setProperty('--accent-custom', accent);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
