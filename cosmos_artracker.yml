# Cosmos import file: pulls the GHCR image and publishes no ports.
# Enable authentication on the Cosmos route — the app has no login of its own.

services:
  artracker:
    image: ghcr.io/myigita/artracker:latest
    expose:
      - "8000"
    volumes:
      # The database. Without this, every rebuild silently wipes all trackers.
      - artracker-data:/data
    environment:
      DATABASE_URL: sqlite:////data/artracker.db
      FRONTEND_DIST: /app/frontend_dist
      # Disables /docs.
      ARTRACKER_ENV: production
    restart: unless-stopped

volumes:
  artracker-data:
