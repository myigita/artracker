services:
  artracker:
    build: .
    ports:
      # Loopback only: the app has no auth, so it must only be reachable through the proxy.
      - "127.0.0.1:8000:8000"
    volumes:
      # Without this volume every rebuild wipes the database.
      - artracker-data:/data
    restart: unless-stopped

volumes:
  artracker-data:
